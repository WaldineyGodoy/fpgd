<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E17" />
    <meta name="description" content="Frente Potiguar de Geração Distribuída: integradores e instaladores de energia solar do RN unidos perante a Cosern." />
    <title>FPGD RN · Frente Potiguar de Geração Distribuída</title>
    <script>
      // Links de e-mail do Supabase (recuperação de senha, convite) chegam como /#access_token=...
      // O app usa HashRouter, então levamos o token para a rota de redefinição antes de carregar.
      (function () {
        if (window.self !== window.top) document.documentElement.classList.add('embedded');
        var h = window.location.hash;
        if (h && h.charAt(1) !== '/' && /(access_token=|error_code=)/.test(h)) {
          window.location.replace(window.location.pathname + '#/reset-password' + h);
        }
      })();
    </script>
  </head>
  <body style="background:#0B0E17">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
